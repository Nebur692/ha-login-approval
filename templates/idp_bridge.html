<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ branding.title or strings.page_title }}</title>
  {% if branding.favicon_path %}<link rel="icon" href="/branding/favicon">{% endif %}
  <style nonce="{{ request.state.csp_nonce }}">
    body {
      font-family: sans-serif; max-width: 400px; margin: 10vh auto; text-align: center; padding: 0 1em;
      {% if branding.background_path %}background: url('/branding/background') center/cover no-repeat fixed;{% endif %}
    }
    .logo { max-width: 160px; max-height: 160px; margin-bottom: 1em; }
    h1 { font-size: 1.3em; margin: 0 0 0.75em; }
    {% if branding.background_path %}.card { background: rgba(255, 255, 255, 0.92); border-radius: 12px; padding: 1.5em; }{% endif %}
    input { width: 100%; padding: 0.5em; font-size: 1em; box-sizing: border-box; }
    button { padding: 0.5em 1.5em; font-size: 1em; margin-top: 1em; cursor: pointer; }
    .secondary { background: none; border: 1px solid #888; }
    #go-back-button { display: none; }
    #waiting-step, #escalation, #recovery-step { display: none; }
    #problem { display: none; margin-top: 1em; }
    .problem-message { color: #b00020; }
    .problem-act { font-weight: bold; }
    .problem-footer { color: #666; font-size: 0.85em; }
    .spinner-wrap { position: relative; margin: 1.5em auto; width: 44px; height: 44px; }
    .spinner {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid #ddd; border-top-color: #555;
      animation: spin 0.8s linear infinite;
    }
    #countdown {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 0.8em; color: #555;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="{% if branding.background_path %}card{% endif %}">
  {% if branding.logo_path %}<img class="logo" src="/branding/logo" alt="">{% endif %}
  {% if branding.title %}<h1>{{ branding.title }}</h1>{% endif %}
  <div id="email-step">
    <p>{{ strings.email_prompt }}</p>
    <form id="email-form">
      <input type="email" id="email" name="email" required autofocus>
      <button type="submit">{{ strings.continue_button }}</button>
    </form>
  </div>

  <div id="waiting-step">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <span id="countdown"></span>
    </div>
    <p>{{ strings.waiting_message }}</p>

    <div id="escalation">
      <p>{{ strings.still_nothing }}</p>
      <button id="retry-button">{{ strings.resend_button }}</button>
      <button id="show-recovery-button" class="secondary">{{ strings.recovery_button }}</button>
    </div>
  </div>

  <div id="recovery-step">
    <p>{{ strings.recovery_prompt }}</p>
    <form id="recovery-form">
      <input type="hidden" id="recovery-request-id">
      <input type="text" id="recovery-code" name="code" placeholder="XXXX-XXXX-XXXX" required autofocus>
      <button type="submit">{{ strings.recovery_submit_button }}</button>
    </form>
  </div>

  <div id="problem">
    <p id="problem-message" class="problem-message"></p>
    <p id="problem-act" class="problem-act"></p>
    <p class="problem-footer"><span id="problem-footer"></span><br><span id="problem-label"></span>: <code id="problem-code"></code></p>
    <p id="problem-return"></p>
  </div>
  <button id="go-back-button" class="secondary">{{ strings.go_back_button }}</button>
  </div>

  <script nonce="{{ request.state.csp_nonce }}">
    const requestId = "{{ request_id }}";
    const STRINGS = {{ strings | tojson }};
    // Every problem this page can show, already in the reader's language and
    // with its burburito code — rendered here, so explaining a failure never
    // needs another request (which may be the very thing that failed).
    const PROBLEMS = {{ problems | tojson }};
    const AUTO_RETURN_SECONDS = {{ auto_return_seconds }};
    const POLL_INTERVAL_MS = 2000;
    const RECOVERY_DELAY_SECONDS = {{ recovery_delay_seconds }};
    let polling = false;

    const emailStep = document.getElementById("email-step");
    const waitingStep = document.getElementById("waiting-step");
    const escalation = document.getElementById("escalation");
    const recoveryStep = document.getElementById("recovery-step");
    const problemEl = document.getElementById("problem");
    const countdownEl = document.getElementById("countdown");
    const goBackButton = document.getElementById("go-back-button");
    let countdownTimer = null;
    let returnTimer = null;

    // Ticks locally every second between polls, but always resynced to the
    // server's waiting_since (from /idp/status) so a page refresh, clock
    // drift, or a retry (which resets waiting_since) never gets it wrong.
    function syncCountdown(waitingSince) {
      clearInterval(countdownTimer);
      if (waitingSince == null) {
        countdownEl.textContent = "";
        return;
      }
      const render = () => {
        const remaining = Math.ceil(RECOVERY_DELAY_SECONDS - (Date.now() / 1000 - waitingSince));
        countdownEl.textContent = remaining > 0 ? remaining : "";
      };
      render();
      countdownTimer = setInterval(render, 1000);
    }

    function showOnly(...steps) {
      for (const el of [emailStep, waitingStep, recoveryStep]) {
        el.style.display = steps.includes(el) ? "block" : "none";
      }
    }

    function hideProblem() {
      problemEl.style.display = "none";
    }

    function backToTheApp() {
      window.location.href = `/idp/fail/${requestId}`;
    }

    // What went wrong, whether the reader needs to act, and the burburito
    // footer. A failure that ends the sign-in stays on screen for
    // AUTO_RETURN_SECONDS, so it can be read, then goes back to the app on its
    // own — nobody should have to click anything to get out of a failed login.
    function showProblem(name, { returnToApp = false } = {}) {
      const p = PROBLEMS[name];
      document.getElementById("problem-message").textContent = p.message;
      document.getElementById("problem-act").textContent = p.act;
      document.getElementById("problem-footer").textContent = p.footer;
      document.getElementById("problem-label").textContent = p.label;
      document.getElementById("problem-code").textContent = p.code;
      const returnEl = document.getElementById("problem-return");
      returnEl.textContent = "";
      problemEl.style.display = "block";
      if (!returnToApp) return;
      goBackButton.style.display = "inline-block";
      let left = AUTO_RETURN_SECONDS;
      const tick = () => {
        returnEl.textContent = STRINGS.returning_in.replace("{s}", left);
        if (left-- <= 0) {
          clearInterval(returnTimer);
          backToTheApp();
        }
      };
      tick();
      returnTimer = setInterval(tick, 1000);
    }

    // fetch() that turns a network failure into the "offline" problem
    // instead of an unhandled rejection that leaves the page frozen.
    async function call(url, options) {
      try {
        return await fetch(url, options);
      } catch (err) {
        polling = false;
        showProblem("offline");
        return null;
      }
    }

    function post(url, fields) {
      return call(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(fields),
      });
    }

    // The server's refusals that mean the same on every step.
    function problemFor(status) {
      if (status === 404) return "expired";
      if (status === 409) return "conflict";
      return "offline";
    }

    document.getElementById("email-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideProblem();
      const email = document.getElementById("email").value;
      const resp = await post("/idp/email", { request_id: requestId, email });
      if (!resp) return;
      if (!resp.ok) {
        showProblem(problemFor(resp.status));
        return;
      }
      showOnly(waitingStep);
      startPolling();
    });

    document.getElementById("retry-button").addEventListener("click", async () => {
      hideProblem();
      escalation.style.display = "none";
      await post("/idp/retry", { request_id: requestId });
    });

    goBackButton.addEventListener("click", backToTheApp);

    document.getElementById("show-recovery-button").addEventListener("click", () => {
      document.getElementById("recovery-request-id").value = requestId;
      hideProblem();
      showOnly(recoveryStep);
    });

    document.getElementById("recovery-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideProblem();
      const code = document.getElementById("recovery-code").value;
      const resp = await post("/idp/recovery", { request_id: requestId, code });
      if (!resp) return;
      if (resp.ok || resp.status === 409) {
        // 409 here means it was approved meanwhile: finish either way.
        window.location.href = `/idp/complete/${requestId}`;
        return;
      }
      if (resp.status === 401) showProblem("recovery_invalid");
      else if (resp.status === 403) showProblem("recovery_not_yet");
      else showProblem(problemFor(resp.status));
    });

    async function poll() {
      if (!polling) return;
      const resp = await call(`/idp/status/${requestId}`);
      if (!resp) return;
      if (!resp.ok) {
        polling = false;
        showProblem(problemFor(resp.status));
        return;
      }
      const data = await resp.json();

      if (data.status === "approved") {
        window.location.href = `/idp/complete/${requestId}`;
        return;
      }

      syncCountdown(data.waiting_since);

      if (data.recovery_available) {
        escalation.style.display = "block";
      }

      if (data.status === "send_failed") {
        // Nothing reached the phone, but a recovery code still can: stay on
        // the page with that offer instead of going back.
        polling = false;
        showProblem("send_failed");
        return;
      }
      if (["rejected", "timeout", "denied"].includes(data.status)) {
        polling = false;
        showProblem(data.status, { returnToApp: true });
        return;
      }

      setTimeout(poll, POLL_INTERVAL_MS);
    }

    function startPolling() {
      polling = true;
      poll();
    }

    // Forward-compatible: if the RP ever sends login_hint, the server
    // already started the approval before this page even rendered.
    (async () => {
      const resp = await call(`/idp/status/${requestId}`);
      if (!resp) return;
      if (!resp.ok) {
        showProblem(problemFor(resp.status));
        return;
      }
      const data = await resp.json();
      if (data.status !== "awaiting_email") {
        showOnly(waitingStep);
        syncCountdown(data.waiting_since);
        startPolling();
      } else {
        showOnly(emailStep);
      }
    })();
  </script>
</body>
</html>
