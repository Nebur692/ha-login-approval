<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Admin{% endblock %} — ha-login-approval</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    nav { margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.75rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #333; }
    nav a.active { font-weight: bold; }
    h1 { font-size: 1.3rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1rem; margin: 0 0 0.5rem; }
    .muted { color: #666; }
    .empty { color: #999; font-style: italic; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    button { padding: 0.4rem 1rem; cursor: pointer; }
    .warn { color: #b00020; }
    code.codes-block { display: block; white-space: pre-wrap; background: #f5f5f5; padding: 0.75rem; border-radius: 6px; margin: 0.75rem 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/admin" class="{% if active == 'home' %}active{% endif %}">Home</a>
    <a href="/admin/devices" class="{% if active == 'devices' %}active{% endif %}">Devices</a>
    <a href="/admin/audit" class="{% if active == 'audit' %}active{% endif %}">Audit</a>
    <a href="/admin/recovery" class="{% if active == 'recovery' %}active{% endif %}">Recovery codes</a>
    <a href="/admin/blocked-ips" class="{% if active == 'blocked_ips' %}active{% endif %}">Blocked IPs</a>
    <a href="/admin/branding" class="{% if active == 'branding' %}active{% endif %}">Branding</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
